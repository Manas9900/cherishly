<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #111; color: #fff; font-family: monospace; }
.row { display: flex; margin-bottom: 20px; }
canvas { border: 1px solid #555; }
</style>
</head>
<body>
<div id="canvases"></div>
<script>
const files = ['om-hp-g-birthday.webp', 'om-hp-g-girlfriend.webp', 'om-hp-g-friendship.webp', 'om-hp-g-anniversary.webp', 'om-hp-g-surprise.webp', 'om-hp-s-step1.webp'];
files.forEach(f => {
    const img = new Image();
    img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        // Draw grid
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.25)';
        ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
        ctx.font = '10px monospace';
        
        for (let y = 0; y < c.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(c.width, y);
            ctx.stroke();
            ctx.fillText(y, 4, y - 2);
        }
        for (let x = 0; x < c.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, c.height);
            ctx.stroke();
            ctx.fillText(x, x + 2, 12);
        }
        
        const wrap = document.createElement('div');
        wrap.innerHTML = '<h3>' + f + '</h3>';
        wrap.appendChild(c);
        document.getElementById('canvases').appendChild(wrap);
    };
    img.src = f;
});
</script>
</body>
</html>
